<!DOCTYPE html>

    <section>
      <h2>1 - Maior de três números</h2>
      <div class="campos">
        <input type="number" id="n1a" placeholder="Número 1">
        <input type="number" id="n1b" placeholder="Número 2">
        <input type="number" id="n1c" placeholder="Número 3">
      </div>
      <button onclick="funcao1();">Executa funcao1</button>
      <p class="resultado" id="res1"></p>
    </section>

    <section>
      <h2>2 - Ordem crescente</h2>
      <div class="campos">
        <input type="number" id="n2a" placeholder="Número 1">
        <input type="number" id="n2b" placeholder="Número 2">

    <section>

      <div class="campos">

      </div>

    <section>

    <section>
      <h2>5 - Dia da semana</h2>
      <div class="campos">
        <input type="date" id="data5">
      </div>
      <button onclick="funcao5();">Executa funcao5</button>
      <p class="resultado" id="res5"></p>
    </section>

</html>
